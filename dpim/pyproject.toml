[project]
name = "dpim"
version = "0.2.1"
description = "DPIM: Double-Place Intelligence Memory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "instructor>=1.0",
    "networkx>=3.2",
    "openai>=1.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
